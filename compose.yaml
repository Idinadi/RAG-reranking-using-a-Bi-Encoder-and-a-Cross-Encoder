services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped

    ports:
      - "8001:8000"

    environment:
      HF_HOME: /root/.cache/huggingface

    volumes:
      - huggingface_cache:/root/.cache/huggingface

    ipc: host

    gpus: all

    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct-AWQ
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "2048"
      - --gpu-memory-utilization
      - "0.80"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --enforce-eager
      - --max-num-seqs
      - "4"

volumes:
  huggingface_cache:
